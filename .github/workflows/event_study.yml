# Method A (event study, VALIDATION_PLAN §3-§6). Manual only.
# build -> (artifact) -> analyze in parallel (universe x window x task) + macro.
# Results go to R2 research/event_study/<run>/; the log shows progress only.
name: event_study
on:
  workflow_dispatch:
    inputs:
      chunks:
        description: "number of stock groups for the build (memory)"
        required: false
        default: "16"
permissions:
  contents: read
  actions: read
concurrency:
  group: event_study
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    outputs:
      run: ${{ steps.run.outputs.run }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
      - run: uv sync --locked --no-dev
      - run: sudo mkdir -p /mnt/es && sudo chown "$USER" /mnt/es
      - id: run
        run: echo "run=$(date -u +%Y%m%dT%H%M)" >> "$GITHUB_OUTPUT"
      - name: Build
        env:
          MW_STORAGE_BACKEND: r2
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          IN_CHUNKS: ${{ inputs.chunks }}
        run: uv run python -m jobs.event_study build --out-dir /mnt/es --chunks "${IN_CHUNKS:-16}"
      - uses: actions/upload-artifact@v7
        with:
          name: es-data
          path: /mnt/es
          retention-days: 3
          compression-level: 0

  analyze:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        universe: [sp500, all]
        window: [main, recent]
        task: [singles_stock, singles_mkt, s5, s20, s60, tree, ml]
        exclude:
          - window: recent
            task: ml
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
      - run: uv sync --locked --no-dev
      - run: sudo mkdir -p /mnt/es && sudo chown "$USER" /mnt/es
      - uses: actions/download-artifact@v8
        with:
          name: es-data
          path: /mnt/es
      - name: Analyze
        env:
          MW_STORAGE_BACKEND: r2
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RUN_ID: ${{ needs.build.outputs.run }}
          U: ${{ matrix.universe }}
          W: ${{ matrix.window }}
          T: ${{ matrix.task }}
        run: uv run python -m jobs.event_study analyze --data-dir /mnt/es --universe "$U" --window "$W" --task "$T" --run "$RUN_ID"

  macro:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
      - run: uv sync --locked --no-dev
      - run: sudo mkdir -p /mnt/es && sudo chown "$USER" /mnt/es
      - uses: actions/download-artifact@v8
        with:
          name: es-data
          path: /mnt/es
      - name: Macro
        env:
          MW_STORAGE_BACKEND: r2
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RUN_ID: ${{ needs.build.outputs.run }}
        run: uv run python -m jobs.event_study macro --data-dir /mnt/es --run "$RUN_ID"
