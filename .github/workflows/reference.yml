# Reference data for validation: S&P 500 membership, FTD, insider trades, shares, margin, CFTC, put/call, SIC.
name: reference
on:
  schedule:
    - cron: "20 5 * * 6"   # weekly (Saturday)
  workflow_dispatch:
    inputs:
      sources:
        description: "sp500,ftd,insider,shares,margin,cftc,pcr,sic,fundamentals"
        required: false
        default: "sp500,ftd,insider,shares,margin,cftc,pcr,fundamentals"
      backfill:
        description: "fetch full history (true/false)"
        required: false
        default: "false"
permissions:
  contents: read
concurrency:
  group: reference
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      MW_STORAGE_BACKEND: r2
      R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
      - run: uv sync --locked --no-dev
      - name: Fetch
        env:
          EVENT: ${{ github.event_name }}
          IN_SOURCES: ${{ inputs.sources }}
          IN_BACKFILL: ${{ inputs.backfill }}
        run: |
          ARGS="--sources ${IN_SOURCES:-sp500,ftd,insider,shares,margin,cftc,pcr,fundamentals}"
          [ "$IN_BACKFILL" = "true" ] && ARGS="$ARGS --backfill"
          echo "args: $ARGS"
          uv run python -m jobs.reference_data $ARGS
