# Daily paper (demo) trading. Runs whenever the prices workflow finishes (and on a fallback schedule);
# idempotent per session, and a session is processed only once its prices are complete.
name: paper
on:
  workflow_run:
    workflows: [prices]
    types: [completed]
  schedule:
    - cron: "40 22 * * 1-5"  # US (prices at 21:30 UTC)
    - cron: "40 23 * * 1-5"  # US retry
    - cron: "40 8 * * 1-5"   # JP (prices at 07:30 UTC)
    - cron: "40 10 * * 1-5"  # JP retry
  workflow_dispatch:
    inputs:
      market:
        description: "US | JP"
        required: true
        default: US
permissions:
  contents: read
concurrency:
  group: paper
  cancel-in-progress: false
jobs:
  trade:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      MW_STORAGE_BACKEND: r2
      R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
      - run: uv sync --locked --no-dev
      - name: Trade
        env:
          SCHED: ${{ github.event.schedule }}
          EVENT: ${{ github.event_name }}
          IN_MARKET: ${{ inputs.market }}
        run: |
          case "$EVENT:$SCHED" in
            workflow_run:*) MARKETS="US JP";;
            schedule:"40 8 * * 1-5"|schedule:"40 10 * * 1-5") MARKETS=JP;;
            schedule:*) MARKETS=US;;
            *) MARKETS="$IN_MARKET";;
          esac
          for MARKET in $MARKETS; do
            echo "market: $MARKET"
            uv run python -m jobs.paper_trade --market $MARKET
          done
