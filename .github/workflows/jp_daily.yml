# Japan daily ingest. JSF files hold the latest day only -> captured twice (redundancy; skip if exists).
name: jp_daily
on:
  schedule:
    - cron: "0 3 * * 1-5"    # JSF final (確報) ~02:00 UTC
    - cron: "30 9 * * 1-5"   # JSF retry + JPX short positions (~08:00 UTC)
  workflow_dispatch:
    inputs:
      sources:
        description: "comma-separated: jsf,jpx_short_positions"
        required: false
        default: "jsf,jpx_short_positions"
      backfill:
        description: "include JPX archive pages (true/false)"
        required: false
        default: "false"
permissions:
  contents: read
concurrency:
  group: jp_daily
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      MW_STORAGE_BACKEND: r2
      R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
      - run: uv sync --locked --no-dev
      - name: Ingest
        env:
          EVENT: ${{ github.event_name }}
          SCHED: ${{ github.event.schedule }}
          IN_SOURCES: ${{ inputs.sources }}
          IN_BACKFILL: ${{ inputs.backfill }}
        run: |
          SOURCES="${IN_SOURCES:-jsf,jpx_short_positions}"
          if [ "$SCHED" = "0 3 * * 1-5" ]; then SOURCES=jsf; fi
          ARGS="--sources $SOURCES"
          [ "$IN_BACKFILL" = "true" ] && ARGS="$ARGS --backfill"
          echo "args: $ARGS"
          uv run python -m jobs.jp_daily $ARGS
