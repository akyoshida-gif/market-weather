[project]
name = "market-weather"
version = "0.1.0"
description = "Probabilistic forecasting system for US & JP equities"
requires-python = ">=3.11,<3.14"
dependencies = [
    "polars>=1.0",
    "pyarrow>=15",
    "duckdb>=1.0",
    "pydantic>=2.6",
    "pyyaml>=6",
    "exchange-calendars>=4.5",
    "boto3>=1.34",
    "yfinance>=1.7",
    "httpx>=0.27",
    "xlrd>=2.0",
    "openpyxl>=3.1",
    "lightgbm>=4.3",
    "scikit-learn>=1.4",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-pyyaml",
    "boto3-stubs[s3]",
    "moto[s3]>=5",
    "xlwt>=1.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mw"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["mw.core.*"]
strict = true

[[tool.mypy.overrides]]
# report/UI glue over polars results; covered by build smoke tests instead of strict typing
module = ["mw.report.*", "mw.strategy.*", "jobs.build_dashboard"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff.lint.per-file-ignores]
"src/mw/report/*" = ["E501"]
"src/mw/research/*" = ["E501", "E731"]
"src/mw/strategy/*" = ["E501", "E731"]
"src/mw/paper/*" = ["E501"]
"jobs/build_dashboard.py" = ["E501"]
